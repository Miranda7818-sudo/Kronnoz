    {id:'a5',icon:'◎',title:'Objetivo al 100%',desc:'Completa un objetivo al 100%',check:()=>goals.some(g=>g.current>=g.target)},
    {id:'a6',icon:'◈',title:'5 sesiones',desc:'Completa 5 sesiones de enfoque',check:()=>focus.sessions>=5},
    {id:'a7',icon:'◉',title:'Racha de 21 días',desc:'Mantén un hábito 21 días',check:()=>habits.some(h=>h.streak>=21)},
    {id:'a8',icon:'★',title:'Leyenda',desc:'Alcanza el rango Leyenda',check:()=>xp>=15000},
  ];

  const [challenges,setChallenges]=useState([]);
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({title:'',desc:'',deadline:''});

  const addChallenge=()=>{
    if(!form.title.trim())return;
    setChallenges(cs=>[...cs,{id:Date.now(),...form,done:false}]);
    setForm({title:'',desc:'',deadline:''});
    setModal(false);
  };

  const unlocked=ACHV.filter(a=>a.check()).length;
  return(
    <div className="fade-in">
      {/* Header */}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:20,paddingBottom:16,borderBottom:'1px solid var(--b1)'}}>
        <div style={{flex:1}}>
          <div style={{fontSize:15,fontWeight:600,marginBottom:4}}>Logros</div>
          <div style={{fontSize:12,color:'var(--g1)',marginBottom:10}}>{unlocked} de {ACHV.length} desbloqueados</div>
          <ProgBar pct={unlocked/ACHV.length*100} color='var(--g1)' height={1}/>
        </div>
        <button className="btn btn-ghost btn-sm" style={{marginLeft:20,marginTop:2,flexShrink:0}} onClick={()=>setModal(true)}>
          + Reto personal
        </button>
      </div>

      {/* Modal */}
      {modal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}
          onClick={e=>e.target===e.currentTarget&&setModal(false)}>
          <div className="card fade-in" style={{width:'100%',maxWidth:400,border:'1px solid var(--b2)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
              <div style={{fontSize:13,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase'}}>Nuevo reto</div>
              <button onClick={()=>setModal(false)} style={{background:'none',border:'none',color:'var(--g2)',fontSize:18,lineHeight:1,cursor:'pointer'}}>×</button>
            </div>
            <div style={{marginBottom:12}}>
              <div className="inp-label">Nombre del reto</div>
              <input className="inp" placeholder="Ej. Leer 10 páginas cada día" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} onKeyDown={e=>e.key==='Enter'&&addChallenge()}/>
            </div>
            <div style={{marginBottom:12}}>
              <div className="inp-label">Descripción (opcional)</div>
              <input className="inp" placeholder="¿Cómo sabrás que lo lograste?" value={form.desc} onChange={e=>setForm(f=>({...f,desc:e.target.value}))}/>
            </div>
            <div style={{marginBottom:20}}>
              <div className="inp-label">Fecha límite (opcional)</div>
              <input className="inp" type="date" value={form.deadline} onChange={e=>setForm(f=>({...f,deadline:e.target.value}))}/>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-red" onClick={addChallenge} disabled={!form.title.trim()} style={{flex:1}}>Crear reto</button>
              <button className="btn btn-ghost" onClick={()=>setModal(false)}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {/* Custom challenges */}
      {challenges.length>0&&(
        <div style={{marginBottom:20}}>
          <div className="section-label">Retos personales</div>
          <div className="grid-2">
            {challenges.map(c=>(
              <div key={c.id} className="card" style={{opacity:c.done?0.45:1,borderColor:c.done?'var(--b2)':'var(--b1)',transition:'all .2s'}}>
                <div style={{display:'flex',gap:12,alignItems:'center'}}>
                  <Chk done={c.done} onClick={()=>setChallenges(cs=>cs.map(x=>x.id===c.id?{...x,done:!x.done}:x))}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,marginBottom:2,textDecoration:c.done?'line-through':'none'}}>{c.title}</div>
                    {c.desc&&<div style={{fontSize:11,color:'var(--g2)',marginBottom:2}}>{c.desc}</div>}
                    {c.deadline&&<div style={{fontSize:10,color:'var(--g2)',letterSpacing:'.04em'}}>{c.deadline}</div>}
                    {c.done&&<div style={{fontSize:10,color:'var(--g1)',marginTop:4,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase'}}>Completado</div>}
                  </div>
                  <button onClick={()=>setChallenges(cs=>cs.filter(x=>x.id!==c.id))} style={{background:'none',border:'none',color:'var(--g3)',fontSize:16,lineHeight:1,cursor:'pointer',flexShrink:0}}>×</button>
                </div>
              </div>
            ))}
          </div>
          <div className="div"/>
        </div>
      )}

      {/* System achievements */}
      <div className="section-label">Logros del sistema</div>
      <div className="grid-2">
        {ACHV.map(a=>{
          const ok=a.check();
          return(
            <div key={a.id} className="card" style={{opacity:ok?1:.45,borderColor:ok?'var(--b2)':'var(--b1)',transition:'all .2s'}}>
              <div style={{display:'flex',gap:12,alignItems:'center'}}>
                <div style={{width:40,height:40,borderRadius:8,background:ok?'var(--s2)':'var(--s3)',border:`1px solid ${ok?'var(--b2)':'var(--b1)'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,color:ok?'var(--text)':'var(--g3)',flexShrink:0}}>
                  {ok?a.icon:'·'}
                </div>
                <div>
                  <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{a.title}</div>
                  <div style={{fontSize:11,color:'var(--g2)'}}>{a.desc}</div>
                  {ok&&<div style={{fontSize:10,color:'var(--g1)',marginTop:4,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase'}}>Desbloqueado</div>}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
});

// ─── Analysis ────────────────────────────────────────────────────────────────
const AnalysisTab=memo(({tasks,habits,xp,rank,doneT,doneH})=>{
  const hour=new Date().getHours();

  // Local rule-based coach — no AI needed
  const insights=useMemo(()=>{
    const tips=[];
    const taskRate=tasks.length?doneT/tasks.length:0;
    const habitRate=habits.length?doneH/habits.length:0;
    const pendingUrgent=tasks.filter(t=>!t.done&&t.quad===0).length;
    const pendingImportant=tasks.filter(t=>!t.done&&t.quad===1).length;
    const maxStreak=habits.length?Math.max(...habits.map(h=>h.streak||0)):0;

    if(pendingUrgent>0) tips.push({label:'Atención inmediata',text:`Tienes ${pendingUrgent} tarea(s) urgentes e importantes sin completar. Son tu prioridad absoluta ahora mismo.`});
    if(taskRate>=0.8) tips.push({label:'Alto rendimiento',text:`Completaste el ${Math.round(taskRate*100)}% de tus tareas. Rendimiento por encima del umbral de excelencia.`});
    else if(taskRate>0&&taskRate<0.5) tips.push({label:'Brecha de ejecución',text:`Solo el ${Math.round(taskRate*100)}% de tareas completadas. Evalúa si tienes demasiadas tareas o si las estás priorizando correctamente.`});
    if(habitRate>=0.8) tips.push({label:'Consistencia de hábitos',text:`${Math.round(habitRate*100)}% de hábitos completados hoy. La consistencia diaria es el único indicador que predice resultados a largo plazo.`});
    else if(habits.length>0&&habitRate<0.5) tips.push({label:'Hábitos en riesgo',text:`Menos del 50% de hábitos completados. Cada día sin ejecutarlos aumenta la probabilidad de abandono.`});
    if(maxStreak>=7) tips.push({label:`Racha de ${maxStreak} días`,text:`Mantener una racha de ${maxStreak} días requiere disciplina real. No la rompas — el costo psicológico de reiniciar es alto.`});
    if(pendingImportant>2) tips.push({label:'Zona de planificación',text:`${pendingImportant} tareas importantes sin fecha urgente. Bloquea tiempo en tu agenda esta semana antes de que se vuelvan urgentes.`});
    if(hour<10) tips.push({label:'Ventana de máximo rendimiento',text:'Las primeras horas del día son tu activo más valioso. Atácalas con las tareas de mayor impacto antes de que lleguen las interrupciones.'});
    else if(hour>=22) tips.push({label:'Cierre del día',text:'Revisa qué quedó sin hacer y muévelo a mañana conscientemente. Cerrar el día con intención reduce la ansiedad nocturna.'});
    if(xp>=1000) tips.push({label:`${xp} XP acumulados`,text:`Estás en el rango ${rank.label}. El progreso sostenido supera siempre al esfuerzo intenso pero esporádico.`});
    if(tips.length===0) tips.push({label:'Sistema en orden',text:'Todas tus métricas están dentro del rango óptimo. Mantén el ritmo y revisa tus objetivos de largo plazo.'});
    return tips;
  },[tasks,habits,xp,doneT,doneH,hour]);

  return(
    <div className="fade-in">
      <div className="grid-2" style={{marginBottom:14}}>
        <div className="card">
          <div className="section-label">Diagnóstico del día</div>
          {insights.map((ins,i)=>(
            <div key={i} style={{paddingBottom:14,marginBottom:14,borderBottom:i<insights.length-1?'1px solid var(--b1)':'none'}}>
              <div style={{fontSize:10,fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--g2)',marginBottom:5}}>{ins.label}</div>
              <div style={{fontSize:13,lineHeight:1.75,color:'var(--text)'}}>{ins.text}</div>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="section-label">Métricas del día</div>
          {[
            ['Tareas completadas',`${doneT} / ${tasks.length}`,tasks.length?Math.round(doneT/tasks.length*100):0],
            ['Hábitos completados',`${doneH} / ${habits.length}`,habits.length?Math.round(doneH/habits.length*100):0],
            ['XP total acumulado',xp,Math.min(xp/150*100,100)],
            ['Rango actual',rank.label,null],
          ].map(([l,v,pct])=>(
            <div key={l} style={{padding:'10px 0',borderBottom:'1px solid var(--b1)'}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:pct!=null?6:0}}>
                <span style={{color:'var(--g1)'}}>{l}</span>
                <span style={{fontWeight:700}}>{v}</span>
              </div>
              {pct!=null&&<ProgBar pct={pct} color='var(--text)' height={1}/>}
            </div>
          ))}
        </div>
      </div>

      <div className="card" style={{marginBottom:14}}>
        <div className="section-label">Actividad semanal — tareas</div>
        <div style={{display:'flex',alignItems:'flex-end',gap:8,height:80}}>
          {[{d:'L',v:8},{d:'M',v:6},{d:'X',v:9},{d:'J',v:7},{d:'V',v:5},{d:'S',v:3},{d:'D',v:0}].map((item,i)=>(
            <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
              <div style={{width:'100%',borderRadius:4,background:i===6?'var(--s3)':'var(--text)',opacity:i===6?.3:1,height:`${(item.v/10)*64}px`,transition:'height .3s ease'}}/>
              <div style={{fontSize:10,color:'var(--g2)'}}>{item.d}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <div className="section-label">Distribución por área</div>
        {AREAS.map(a=>{
          const count=tasks.filter(t=>t.cat===a).length;
          const done=tasks.filter(t=>t.cat===a&&t.done).length;
          if(!count)return null;
          return(
            <div key={a} style={{display:'flex',alignItems:'center',gap:14,padding:'9px 0',borderBottom:'1px solid var(--b1)'}}>
              <div style={{width:72,fontSize:12,color:'var(--g1)',textTransform:'capitalize'}}>{a}</div>
              <div style={{flex:1}}><ProgBar pct={done/count*100} color='var(--text)' height={1}/></div>
              <div style={{fontSize:11,color:'var(--g2)',width:32,textAlign:'right'}}>{done}/{count}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
});


// ─── Books ───────────────────────────────────────────────────────────────────
const BooksTab=memo(({books,setBooks})=>{
  const [showAdd,setShowAdd]=useState(false);
  const [nb,setNb]=useState({title:'',author:'',status:'reading',rating:0,pages:'',notes:'',lessons:[]});
  const [newL,setNewL]=useState('');
  const [expandId,setExpandId]=useState(null);
  const STATUSES=[{id:'reading',label:'Leyendo',color:'var(--g1)'},{id:'done',label:'Leído',color:'var(--g1)'},{id:'pending',label:'Por leer',color:'var(--g2)'}];
  const STARS=[1,2,3,4,5];

  const save=()=>{
    if(!nb.title.trim())return;
    setBooks(bs=>[...bs,{id:Date.now(),...nb,pages:parseInt(nb.pages)||0,addedAt:new Date().toISOString().slice(0,10)}]);
    setNb({title:'',author:'',status:'reading',rating:0,pages:'',notes:'',lessons:[]});
    setNewL('');setShowAdd(false);
    toast('Libro agregado','Registrado en tu biblioteca.');
  };

  const byStatus=(s)=>books.filter(b=>b.status===s);

  return(
    <div className="fade-in">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div>
          <div style={{fontSize:15,fontWeight:600,marginBottom:2}}>Biblioteca</div>
          <div style={{fontSize:11,color:'var(--g1)'}}>{books.filter(b=>b.status==='done').length} leído(s) · {books.filter(b=>b.status==='reading').length} en progreso</div>
        </div>
        <button className="btn btn-red" onClick={()=>setShowAdd(v=>!v)}>{showAdd?'✕ Cancelar':'+ Nuevo libro'}</button>
      </div>

      {showAdd&&(
        <div className="card fade-in" style={{marginBottom:14}}>
          <div className="section-label">Agregar libro</div>
          <div className="grid-2" style={{marginBottom:10}}>
            <div><div className="inp-label">Título</div><input className="inp" value={nb.title} onChange={e=>setNb(b=>({...b,title:e.target.value}))} placeholder="Título del libro"/></div>
            <div><div className="inp-label">Autor</div><input className="inp" value={nb.author} onChange={e=>setNb(b=>({...b,author:e.target.value}))} placeholder="Nombre del autor"/></div>
          </div>
          <div className="grid-2" style={{marginBottom:10}}>
            <div>
              <div className="inp-label">Estado</div>
              <div style={{display:'flex',gap:6}}>
                {STATUSES.map(s=>(<button key={s.id} onClick={()=>setNb(b=>({...b,status:s.id}))} className="btn btn-sm" style={{background:nb.status===s.id?'var(--s3)':'transparent',color:nb.status===s.id?s.color:'var(--g1)',border:`1px solid ${nb.status===s.id?'var(--b2)':'var(--b1)'}`}}>{s.label}</button>))}
              </div>
            </div>
            <div>
              <div className="inp-label">Páginas (opcional)</div>
              <input className="inp" type="number" value={nb.pages} onChange={e=>setNb(b=>({...b,pages:e.target.value}))} placeholder="300"/>
            </div>
          </div>
          <div style={{marginBottom:10}}>
            <div className="inp-label">Calificación</div>
            <div style={{display:'flex',gap:6}}>
              {STARS.map(s=>(<span key={s} onClick={()=>setNb(b=>({...b,rating:s}))} style={{fontSize:18,cursor:'pointer',color:s<=nb.rating?'var(--g1)':'var(--g3)',transition:'color .12s'}}>★</span>))}
            </div>
          </div>
          <div style={{marginBottom:10}}>
            <div className="inp-label">Notas / resumen (opcional)</div>
            <textarea className="inp" value={nb.notes} onChange={e=>setNb(b=>({...b,notes:e.target.value}))} placeholder="Ideas principales, citas, reflexiones..." rows={3} style={{resize:'vertical',fontFamily:'inherit'}}/>
          </div>
          <div style={{marginBottom:14}}>
            <div className="inp-label">Lecciones aprendidas</div>
            <div className="card-inner">
              {nb.lessons.map((l,i)=>(<div key={i} style={{display:'flex',gap:8,padding:'5px 0',fontSize:12,borderBottom:i<nb.lessons.length-1?'1px solid var(--b1)':'none',alignItems:'center'}}>
                <span style={{color:'var(--g2)'}}>·</span><span style={{flex:1}}>{l}</span>
                <button onClick={()=>setNb(b=>({...b,lessons:b.lessons.filter((_,j)=>j!==i)}))} style={{background:'none',border:'none',color:'var(--g3)',cursor:'pointer'}}>×</button>
              </div>))}
              <input className="inp" value={newL} onChange={e=>setNewL(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter'&&newL.trim()){setNb(b=>({...b,lessons:[...b.lessons,newL.trim()]}));setNewL('');}}}
                placeholder="Escribe una lección y presiona Enter" style={{marginTop:nb.lessons.length?8:0,fontSize:12}}/>
            </div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-red btn-sm" disabled={!nb.title.trim()} onClick={save}>Guardar</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>setShowAdd(false)}>Cancelar</button>
          </div>
        </div>
      )}

      {/* Stats bar */}
      {books.length>0&&(
        <div className="grid-3" style={{marginBottom:14}}>
          {[['Leídos',books.filter(b=>b.status==='done').length,'var(--g1)'],['En progreso',books.filter(b=>b.status==='reading').length,'var(--g1)'],['Por leer',books.filter(b=>b.status==='pending').length,'var(--g1)']].map(([l,v,c])=>(
            <div key={l} className="card-inner" style={{textAlign:'center'}}>
              <div style={{fontSize:22,fontWeight:700,color:c,marginBottom:4}}>{v}</div>
              <div style={{fontSize:10,color:'var(--g2)',textTransform:'uppercase',letterSpacing:'.08em'}}>{l}</div>
            </div>
          ))}
        </div>
      )}

      {/* Books by status */}
      {STATUSES.map(st=>{
        const items=byStatus(st.id);
        if(!items.length)return null;
        return(
          <div key={st.id} style={{marginBottom:20}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
              <div style={{width:6,height:6,borderRadius:'50%',background:st.color}}/>
              <div className="section-label" style={{marginBottom:0,color:st.color}}>{st.label} — {items.length}</div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {items.map(b=>{
                const expanded=expandId===b.id;
                return(
                  <div key={b.id} className="card" style={{cursor:'pointer'}} onClick={()=>setExpandId(expanded?null:b.id)}>
                    <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
                      <div style={{flex:1,paddingRight:12}}>
                        <div style={{fontSize:13,fontWeight:600,marginBottom:3}}>{b.title}</div>
                        <div style={{fontSize:11,color:'var(--g1)',marginBottom:b.rating?6:0}}>{b.author||'—'}{b.pages?' · '+b.pages+' págs':''}</div>
                        {b.rating>0&&<div style={{fontSize:13}}>{STARS.map(s=>(<span key={s} style={{color:s<=b.rating?'var(--g1)':'var(--g3)'}}>★</span>))}</div>}
                      </div>
                      <div style={{display:'flex',gap:8,alignItems:'center'}}>
                        <div style={{fontSize:9,padding:'2px 6px',border:`1px solid ${st.color}55`,borderRadius:2,color:st.color,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase'}}>{st.label}</div>
                        <button onClick={e=>{e.stopPropagation();setBooks(bs=>bs.filter(x=>x.id!==b.id));}} style={{background:'none',border:'none',color:'var(--g3)',cursor:'pointer',fontSize:14}}>×</button>
                      </div>
                    </div>
                    {expanded&&(
                      <div style={{marginTop:14,paddingTop:14,borderTop:'1px solid var(--b1)'}}>
                        {/* Status change */}
                        <div style={{marginBottom:12}}>
                          <div className="inp-label" style={{marginBottom:6}}>Cambiar estado</div>
                          <div style={{display:'flex',gap:6}}>
                            {STATUSES.map(s=>(<button key={s.id} onClick={e=>{e.stopPropagation();setBooks(bs=>bs.map(x=>x.id===b.id?{...x,status:s.id}:x));}} className="btn btn-sm" style={{background:b.status===s.id?'var(--s3)':'transparent',color:b.status===s.id?s.color:'var(--g1)',border:`1px solid ${b.status===s.id?'var(--b2)':'var(--b1)'}`}}>{s.label}</button>))}
                          </div>
                        </div>
                        {b.notes&&(
                          <div style={{marginBottom:12}}>
                            <div className="inp-label" style={{marginBottom:6}}>Notas</div>
                            <div style={{fontSize:12,color:'var(--g1)',lineHeight:1.7,background:'var(--s2)',borderRadius:4,padding:'10px 12px'}}>{b.notes}</div>
                          </div>
                        )}
                        {b.lessons?.length>0&&(
                          <div>
                            <div className="inp-label" style={{marginBottom:6}}>Lecciones aprendidas</div>
                            {b.lessons.map((l,i)=>(<div key={i} style={{display:'flex',gap:8,padding:'5px 0',fontSize:12,borderTop:i>0?'1px solid var(--b1)':'none',color:'var(--g1)'}}>
                              <span style={{color:'var(--text)',flexShrink:0}}>·</span><span>{l}</span>
                            </div>))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      {books.length===0&&!showAdd&&(
        <div style={{textAlign:'center',padding:'48px 0',color:'var(--g2)'}}>
          <div style={{fontSize:32,marginBottom:12}}>□</div>
          <div style={{fontSize:13,marginBottom:4}}>Tu biblioteca está vacía</div>
          <div style={{fontSize:11}}>Agrega libros que leas y registra lo que aprendes</div>
        </div>
      )}
    </div>
  );
});

// ─── Mount (no StrictMode = no double-render flicker) ────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
